name: patch-student-hours
on: push
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[student-hours-done]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch student hours, center number and reports
        env:
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('app/students/students-page-v2.tsx')
          s=p.read_text()

          s=s.replace('  center_name: string | null;\n', '  center_name: string | null;\n  center_number: string | null;\n')
          s=s.replace('  center_name: string;\n', '  center_name: string;\n  center_number: string;\n')
          s=s.replace('  currency_code: "EUR", center_name: "", monthly_hours: "8",', '  currency_code: "EUR", center_name: "", center_number: "", monthly_hours: "8",')
          s=s.replace('      center_name: student.center_name || "",\n', '      center_name: student.center_name || "",\n      center_number: student.center_number || "",\n')

          # Validation and payload for center number.
          s=s.replace('if (form.compensation_type === "center" && !form.center_name.trim())', 'if (form.compensation_type === "center" && (!form.center_name.trim() || !form.center_number.trim()))')
          s=s.replace('center_name: form.compensation_type === "center" ? form.center_name.trim() : null,', 'center_name: form.compensation_type === "center" ? form.center_name.trim() : null,\n      center_number: form.compensation_type === "center" ? form.center_number.trim() : null,')
          s=s.replace('setForm((current) => ({ ...current, compensation_type: "center", currency_code: "" }))', 'setForm((current) => ({ ...current, compensation_type: "center", currency_code: "" }))')

          # Add center-number field next to center name field.
          if 'name="center_number"' not in s:
              pat=r'(<label[^>]*>\s*اسم المركز[\s\S]*?</label>)'
              m=re.search(pat,s)
              if m:
                  extra='\n    <label className="compensation-dependent">رقم المركز <em>*</em><input name="center_number" value={form.center_number} onChange={(e) => setForm({ ...form, center_number: e.target.value })} placeholder="مثال: 1024" /></label>'
                  s=s[:m.end()]+extra+s[m.end():]

          # State for hours and lesson/report modals.
          state_marker='  const [detailLoading, setDetailLoading] = useState(false);\n'
          state_add='''  const [studentHours, setStudentHours] = useState<Record<string, number>>({});\n  const [lessonStudent, setLessonStudent] = useState<Student | null>(null);\n  const [lessonOpen, setLessonOpen] = useState(false);\n  const [lessonSaving, setLessonSaving] = useState(false);\n  const [lessonForm, setLessonForm] = useState({ date: new Date().toISOString().slice(0, 10), time: "", minutes: "60", notes: "" });\n  const [centerReportStudent, setCenterReportStudent] = useState<Student | null>(null);\n  const [centerReportOpen, setCenterReportOpen] = useState(false);\n'''
          if 'const [studentHours' not in s:
              s=s.replace(state_marker, state_marker+state_add)

          # Load current-month completed lesson hours.
          marker='    if (!s.error) setStudents((s.data || []) as Student[]);\n'
          addition='''    const monthStart = new Date();\n    monthStart.setDate(1);\n    monthStart.setHours(0, 0, 0, 0);\n    const nextMonth = new Date(monthStart);\n    nextMonth.setMonth(nextMonth.getMonth() + 1);\n    const { data: hourRows } = await supabase\n      .from("events")\n      .select("student_id,starts_at,ends_at")\n      .eq("event_type", "lesson")\n      .eq("status", "completed")\n      .gte("starts_at", monthStart.toISOString())\n      .lt("starts_at", nextMonth.toISOString());\n    const hourMap: Record<string, number> = {};\n    (hourRows || []).forEach((row: any) => {\n      const minutes = Math.max(0, (new Date(row.ends_at).getTime() - new Date(row.starts_at).getTime()) / 60000);\n      hourMap[row.student_id] = (hourMap[row.student_id] || 0) + minutes / 60;\n    });\n    setStudentHours(hourMap);\n'''
          if 'const monthStart = new Date();' not in s:
              s=s.replace(marker, marker+addition)

          # Lesson/report functions before render.
          function_marker='  return (\n'
          funcs='''  const openLessonModal = (student: Student) => {\n    setLessonStudent(student);\n    setLessonForm({ date: new Date().toISOString().slice(0, 10), time: new Date().toTimeString().slice(0, 5), minutes: "60", notes: "" });\n    setLessonOpen(true);\n  };\n\n  const saveRecordedLesson = async (event: FormEvent) => {\n    event.preventDefault();\n    if (!lessonStudent) return;\n    const minutes = Math.max(1, Number(lessonForm.minutes || 0));\n    const startsAt = new Date(`${lessonForm.date}T${lessonForm.time || "00:00"}:00`);\n    const endsAt = new Date(startsAt.getTime() + minutes * 60000);\n    if (Number.isNaN(startsAt.getTime())) { setMessage("اختر تاريخ ووقت الحصة."); return; }\n    setLessonSaving(true);\n    const { data: user } = await supabase.auth.getUser();\n    if (!user.user) { setMessage("انتهت جلسة الدخول."); setLessonSaving(false); return; }\n    const { error } = await supabase.from("events").insert({\n      student_id: lessonStudent.id,\n      teacher_id: user.user.id,\n      event_type: "lesson",\n      title: `حصة — ${lessonStudent.full_name}`,\n      starts_at: startsAt.toISOString(),\n      ends_at: endsAt.toISOString(),\n      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,\n      status: "completed",\n      is_makeup: false,\n      reminder_minutes: 0,\n      notes: lessonForm.notes.trim() || null,\n    });\n    if (error) { setMessage(error.message); setLessonSaving(false); return; }\n    const newHours = (studentHours[lessonStudent.id] || 0) + minutes / 60;\n    setStudentHours((current) => ({ ...current, [lessonStudent.id]: newHours }));\n    setLessonOpen(false);\n    setLessonSaving(false);\n    const completed = newHours + 0.001 >= Number(lessonStudent.monthly_hours || 0);\n    if (completed) {\n      setMessage(`تم تسجيل الحصة. ${lessonStudent.full_name} أنهى ساعاته الشهرية المقررة.`);\n      if (lessonStudent.compensation_type === "center") { setCenterReportStudent(lessonStudent); setCenterReportOpen(true); }\n    } else {\n      setMessage(`تم تسجيل ${minutes} دقيقة للطالب ${lessonStudent.full_name}.`);\n    }\n  };\n\n  const centerReportText = centerReportStudent\n    ? `السلام عليكم ورحمة الله وبركاته،\\n\\nنفيدكم بأن الطالب/ة ${centerReportStudent.full_name} قد أنهى/ت ساعاته/ا الشهرية المقررة لهذا الشهر.\\n\\nالتاريخ: ${new Intl.DateTimeFormat("ar-EG", { day: "numeric", month: "long", year: "numeric" }).format(new Date())}\\nاسم الطالب: ${centerReportStudent.full_name}\\nالمركز: ${centerReportStudent.center_name || "—"}\\nرقم المركز: ${centerReportStudent.center_number || "—"}\\n\\nمع خالص التحية.`\n    : "";\n\n  const copyCenterReport = async () => {\n    if (!centerReportText) return;\n    await navigator.clipboard?.writeText(centerReportText);\n    setMessage("تم نسخ تقرير المركز، وهو جاهز للإرسال.");\n  };\n\n'''
          if 'const openLessonModal' not in s:
              s=s.replace(function_marker, funcs+function_marker, 1)

          # Add register button to each card's existing actions.
          if 'record-lesson-button' not in s:
              s=s.replace('<div className="student-actions">', '<div className="student-actions"><button type="button" className="record-lesson-button" onClick={() => openLessonModal(student)} title="تسجيل حصة"><Plus size={15} /></button>', 1)

          # Add the hours footer inside each card as last flex item by assigning high order.
          if 'student-hours-bar' not in s:
              token='<div className="student-row">'
              bar='<div className="student-row"><div className="student-hours-bar"><div><span>ساعات الشهر</span><strong>{(studentHours[student.id] || 0).toFixed(1)} / {Number(student.monthly_hours || 0).toFixed(1)} ساعة</strong></div><div className="student-hours-track"><i style={{ width: `${Math.min(100, ((studentHours[student.id] || 0) / Math.max(0.01, Number(student.monthly_hours || 0))) * 100)}%` }} /></div><small>{(studentHours[student.id] || 0) >= Number(student.monthly_hours || 0) ? "اكتملت الساعات الشهرية" : `متبقي ${Math.max(0, Number(student.monthly_hours || 0) - (studentHours[student.id] || 0)).toFixed(1)} ساعة`}</small></div>'
              s=s.replace(token,bar,1)

          # Insert modals before closing main.
          if 'className="lesson-record-modal"' not in s:
              modal='''\n      {lessonOpen && lessonStudent ? <div className="modal-backdrop"><section className="student-modal lesson-record-modal"><header><div><h2>تسجيل حصة</h2><p>{lessonStudent.full_name}</p></div><button className="close-button" type="button" onClick={() => setLessonOpen(false)}><X size={16} /></button></header><form onSubmit={saveRecordedLesson}><div className="form-grid"><label>التاريخ<input type="date" value={lessonForm.date} onChange={(e) => setLessonForm({ ...lessonForm, date: e.target.value })} required /></label><label>وقت الحصة<input type="time" value={lessonForm.time} onChange={(e) => setLessonForm({ ...lessonForm, time: e.target.value })} required /></label><label>مدة الحصة بالدقائق<input type="number" min="1" value={lessonForm.minutes} onChange={(e) => setLessonForm({ ...lessonForm, minutes: e.target.value })} required /></label><label className="full-field">ملاحظات الحصة<textarea value={lessonForm.notes} onChange={(e) => setLessonForm({ ...lessonForm, notes: e.target.value })} rows={3} /></label></div><footer className="detail-footer"><button type="button" className="secondary-button" onClick={() => setLessonOpen(false)}>إلغاء</button><button className="primary-button" type="submit" disabled={lessonSaving}><Plus size={15} />{lessonSaving ? "جارٍ التسجيل..." : "تسجيل الحصة"}</button></footer></form></section></div> : null}\n      {centerReportOpen && centerReportStudent ? <div className="modal-backdrop"><section className="student-modal center-report-modal"><header><div><h2>تم إنهاء الساعات الشهرية</h2><p>{centerReportStudent.full_name} — {centerReportStudent.center_name || "المركز"}</p></div><button className="close-button" type="button" onClick={() => setCenterReportOpen(false)}><X size={16} /></button></header><div className="center-report-body"><div className="completion-banner"><Check size={18} /><div><strong>الطالب أنهى الساعات المقررة</strong><small>تم الوصول إلى الحد الشهري الكامل.</small></div></div><label className="full-field">رسالة التقرير<textarea readOnly rows={9} value={centerReportText} /></label></div><footer className="detail-footer"><button type="button" className="secondary-button" onClick={() => setCenterReportOpen(false)}>إغلاق</button><button type="button" className="primary-button" onClick={copyCenterReport}><FileText size={15} /> نسخ التقرير وإرساله للمركز</button></footer></section></div> : null}\n'''
              idx=s.rfind('</main>')
              if idx!=-1: s=s[:idx]+modal+s[idx:]

          p.write_text(s)

          css=Path('app/students/students-overrides.css')
          c=css.read_text()
          c += '''\n/* Student monthly hours + lesson registration */\n.student-hours-bar{order:99!important;margin-top:auto!important;padding:11px 15px 13px!important;border-top:1px solid #e8e6dd!important;background:linear-gradient(180deg,#f7f8f3 0%,#f3f4ee 100%)!important;display:grid!important;grid-template-columns:auto 1fr auto;align-items:center!important;gap:9px!important}\n.student-hours-bar>div:first-child{display:flex!important;align-items:baseline!important;gap:6px!important;white-space:nowrap!important}.student-hours-bar span{font-size:8px!important;color:#949c94!important}.student-hours-bar strong{font-size:10px!important;color:#4d6052!important}.student-hours-track{height:6px!important;overflow:hidden!important;background:#e1e5dc!important;border-radius:999px!important}.student-hours-track i{display:block!important;height:100%!important;background:linear-gradient(90deg,#728a70,#526a58)!important;border-radius:999px!important;transition:width .3s ease!important}.student-hours-bar small{font-size:8px!important;color:#808a80!important;white-space:nowrap!important}.record-lesson-button{background:linear-gradient(135deg,#536d5b,#6f856f)!important;color:#fff!important;border-color:transparent!important;box-shadow:0 5px 12px rgba(65,88,72,.14)!important}.record-lesson-button:hover{transform:translateY(-1px)!important;box-shadow:0 8px 16px rgba(65,88,72,.19)!important}.lesson-record-modal .form-grid{gap:14px!important}.lesson-record-modal textarea,.center-report-modal textarea{width:100%!important;border:1px solid var(--rq-border,#e4e2d8)!important;border-radius:11px!important;background:#fffefa!important;padding:12px!important;font:inherit!important;font-size:12px!important;color:#334137!important;resize:vertical!important}.center-report-body{padding:20px 24px!important}.completion-banner{display:flex!important;align-items:center!important;gap:10px!important;padding:13px 15px!important;border:1px solid #d9e5d5!important;background:#eef4eb!important;color:#4e654f!important;border-radius:13px!important;margin-bottom:16px!important}.completion-banner>svg{flex:none!important}.completion-banner strong{display:block!important;font-size:12px!important}.completion-banner small{display:block!important;font-size:9px!important;color:#7d897d!important;margin-top:3px!important}\n@media(max-width:760px){.student-hours-bar{grid-template-columns:1fr!important;gap:6px!important}.student-hours-bar>div:first-child{justify-content:space-between!important}.student-hours-bar small{text-align:right!important}.center-report-body{padding:16px!important}}\n'''
          css.write_text(c)

          print('patched')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/students/students-page-v2.tsx app/students/students-overrides.css
          git commit -m "feat: add student lesson hours and center reports [student-hours-done]"
          git rm .github/workflows/patch_student_hours.yml
          git commit -m "chore: remove student hours patch workflow [student-hours-done]"
          git push
