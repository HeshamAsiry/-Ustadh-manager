name: inspect-v2
on: push
jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, '[inspect-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print relevant V2 sections
        run: |
          python - <<'PY'
          p='app/students/students-page-v2.tsx'
          s=open(p).read().splitlines()
          keys=['filtered.map','student-actions','student-row','return (','<main','setFormOpen']
          for k in keys:
              hits=[i+1 for i,x in enumerate(s) if k in x]
              print('\n###',k,hits[:20])
              for h in hits[:4]:
                  a=max(1,h-8); b=min(len(s),h+22)
                  print(f'-- lines {a}-{b} --')
                  for n in range(a,b+1): print(f'{n}: {s[n-1]}')
          PY
